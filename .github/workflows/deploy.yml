name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci || npm install --legacy-peer-deps

      - name: Build
        working-directory: app
        run: npm run build

      - name: Ensure data files present
        run: |
          # data is gitignored; regenerate from raw sources when present,
          # otherwise fall back to the committed public/data snapshot
          if [ ! -d app/dist/data ] || [ -z "$(ls -A app/dist/data 2>/dev/null)" ]; then
            echo "::warning::dist/data missing — copying committed snapshot"
            mkdir -p app/dist/data
            cp -r app/public/data/* app/dist/data/ 2>/dev/null || true
          fi
          ls -la app/dist/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
